<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Cane Transit Simulator</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#f7fbff;background:#07111f}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#18385b 0,#07111f 42%);padding:28px}
    main{max-width:860px;margin:auto}.eyebrow{color:#63e6be;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:clamp(2rem,6vw,4rem);line-height:1;margin:.2em 0}.lead{font-size:1.15rem;color:#bfd0df;max-width:680px}
    .card{background:#101f31;border:1px solid #29435e;border-radius:20px;padding:22px;margin-top:22px;box-shadow:0 18px 60px #0006}
    label{display:block;margin-bottom:8px;font-weight:700}select,button{width:100%;font:inherit;border-radius:12px;padding:15px}
    select{color:white;background:#07111f;border:2px solid #47657f}button{margin-top:14px;border:0;background:#63e6be;color:#062017;font-weight:900;cursor:pointer}
    button:focus,select:focus{outline:4px solid #ffd43b;outline-offset:3px}.result{display:none}.badge{display:inline-block;padding:8px 12px;border-radius:999px;background:#23405d;font-weight:900}
    .instruction{font-size:1.45rem;line-height:1.35}.trace{color:#b8c9d8;padding-left:22px}.trace li{margin:.65em 0}
    .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.meta div{background:#07111f;padding:12px;border-radius:10px}
    @media(max-width:600px){body{padding:16px}.meta{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <div class="eyebrow">GuideSense · Hardware simulation dashboard</div>
  <h1>Smart Cane Transit Orchestrator</h1>
  <p class="lead">Simulates an ETA-triggered cane-camera scan, reconciles live arrival data with visual evidence, and sends a command to the haptic handle.</p>
  <section class="card">
    <label for="scenario">Demo street condition</label>
    <select id="scenario">
      <option value="on_time">Expected bus arrives</option><option value="wrong_bus">Wrong bus arrives</option>
      <option value="off_service">Expected bus is off service</option><option value="late">Bus becomes significantly late</option>
      <option value="conflict">Arrival API and camera disagree</option>
    </select>
    <button id="check">Simulate LTA arrival trigger</button>
  </section>
  <section class="card result" id="result" aria-live="assertive">
    <span class="badge" id="action"></span><p class="instruction" id="instruction"></p>
    <div class="meta"><div><small>Confidence</small><br><strong id="confidence"></strong></div><div><small>Cane handle command</small><br><strong id="haptic"></strong></div><div><small>Decision</small><br><strong id="reason"></strong></div></div>
    <h2>Agent trace</h2><ol class="trace" id="trace"></ol>
  </section>
</main><script>
const payload=s=>({journey:{user_id:"demo-user",bus_stop_code:"27211",expected_bus:"199",destination:"Boon Lay MRT",original_eta_minutes:3,preferences:{minimise_walking:true,prefer_sheltered_paths:true,prefer_tactile_paving:true,prefer_signalised_crossings:true,avoid_stairs:true,maximum_transfers:1}},cane_telemetry:{device_id:"cane-demo-01",battery_percent:84,heading_degrees:270,walking_speed_mps:0,camera_ready:true},demo_scenario:s});
document.querySelector('#check').onclick=async()=>{const b=document.querySelector('#check');b.disabled=true;b.textContent='LTA trigger received — cane camera scanning…';try{const r=await fetch('/agent/check-bus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload(document.querySelector('#scenario').value))});const d=await r.json();if(!r.ok)throw Error(d.detail||'Agent failed');document.querySelector('#result').style.display='block';document.querySelector('#action').textContent=d.action;document.querySelector('#instruction').textContent=d.spoken_instruction;document.querySelector('#confidence').textContent=Math.round(d.confidence*100)+'%';document.querySelector('#haptic').textContent=d.haptic_command.pattern+' · '+d.haptic_command.actuators.join(' → ');document.querySelector('#reason').textContent=d.reason_code;document.querySelector('#trace').innerHTML=d.trace.map(x=>`<li>${x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</li>`).join('');speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(d.spoken_instruction));}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='Simulate LTA arrival trigger'}};
</script></body></html>
